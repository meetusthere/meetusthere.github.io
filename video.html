<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meet us There – Erklärvideo</title>
<style>
  body { margin: 0; background: #F3F6F5; color: #1D2B2E; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  .top { display: flex; align-items: center; gap: 6px; padding: 12px 16px; }
  .langs { display: flex; gap: 6px; flex-wrap: wrap; }
  .langs button { font: inherit; font-size: 13px; font-weight: 700; padding: 5px 12px; border-radius: 999px; border: 1px solid #E1E8E6; background: #fff; color: #4F6166; cursor: pointer; }
  .langs button.on { background: #3F8F80; border-color: #3F8F80; color: #fff; }
  main { max-width: 440px; margin: 0 auto; padding: 4px 16px 40px; }
  h1 { font-size: 24px; margin: 6px 0 14px; text-align: center; }
  video { width: 100%; border-radius: 18px; background: #2B6E62; box-shadow: 0 6px 24px rgba(29, 43, 46, .2); display: block; }
  p { line-height: 1.5; text-align: center; color: #4F6166; }
</style>
</head>
<body>
<div class="top">
  <div class="langs">
    <button data-l="de">DE</button>
    <button data-l="en">EN</button>
    <button data-l="es">ES</button>
    <button data-l="it">IT</button>
    <button data-l="pt">PT</button>
    <button data-l="fr">FR</button>
    <button data-l="pl">PL</button>
  </div>
</div>
<main>
  <h1 id="h"></h1>
  <video id="v" controls playsinline preload="metadata"></video>
  <p id="p"></p>
</main>
<script>
  // Eine Seite für alle Sprachen: ?lang=de|en|es|it|pt|fr|pl – Video in jeder Sprache
  var T = {
    de: { title: 'Meet us There – Erklärvideo', h: 'So funktioniert Meet us There', p: 'Sag, wo du sowieso bist. Wer mag, kommt vorbei – keine Zusagen, kein Druck.' },
    en: { title: 'Meet us There – Explainer video', h: 'How Meet us There works', p: "Share where you'll be anyway. Whoever likes drops by – no commitments, no pressure." },
    es: { title: 'Meet us There – Vídeo explicativo', h: 'Así funciona Meet us There', p: 'Di dónde vas a estar de todos modos. Quien quiera, se pasa – sin compromisos, sin presión.' },
    it: { title: 'Meet us There – Video introduttivo', h: 'Come funziona Meet us There', p: 'Di dove sarai comunque. Chi vuole passa – nessun impegno, nessuna pressione.' },
    pt: { title: 'Meet us There – Vídeo explicativo', h: 'Como funciona o Meet us There', p: 'Diga onde você vai estar de qualquer jeito. Quem quiser aparece – sem compromisso, sem pressão.' },
    fr: { title: 'Meet us There – Vidéo explicative', h: 'Comment fonctionne Meet us There', p: 'Dis où tu seras de toute façon. Qui veut passe te voir – sans engagement, sans pression.' },
    pl: { title: 'Meet us There – Film instruktażowy', h: 'Jak działa Meet us There', p: 'Powiedz, gdzie i tak będziesz. Kto chce, wpadnie – bez zobowiązań, bez presji.' }
  };
  var q = new URLSearchParams(location.search);
  var lang = q.get('lang');

  function show(l) {
    var t = T[l], v = document.getElementById('v');
    document.documentElement.lang = l;
    var vl = l;
    document.title = t.title;
    document.getElementById('h').textContent = t.h;
    document.getElementById('p').textContent = t.p;
    v.pause();
    v.poster = 'poster-' + vl + '.jpg';
    v.src = 'erklaervideo-' + vl + '.mp4';
    v.load();
    document.querySelectorAll('.langs button').forEach(function (b) { b.classList.toggle('on', b.dataset.l === l); });
    history.replaceState(null, '', '?lang=' + l);
  }
  document.querySelectorAll('.langs button').forEach(function (b) { b.onclick = function () { show(b.dataset.l); }; });
  var nl = (navigator.language || 'en').slice(0, 2).toLowerCase();
  var ok = function (x) { return Object.prototype.hasOwnProperty.call(T, x); };
  show(ok(lang) ? lang : ok(nl) ? nl : 'en');
</script>
</body>
</html>
