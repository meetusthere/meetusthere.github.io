<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meet us There – Erklärvideo</title>
<style>
  body { margin: 0; background: #F3F6F5; color: #1D2B2E; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  .top { display: flex; align-items: center; gap: 6px; padding: 12px 16px; }
  .langs { display: flex; gap: 6px; }
  .langs button { font: inherit; font-size: 13px; font-weight: 700; padding: 5px 12px; border-radius: 999px; border: 1px solid #E1E8E6; background: #fff; color: #4F6166; cursor: pointer; }
  .langs button.on { background: #3F8F80; border-color: #3F8F80; color: #fff; }
  .langs button[hidden] { display: none; }
  main { max-width: 440px; margin: 0 auto; padding: 4px 16px 40px; }
  h1 { font-size: 24px; margin: 6px 0 14px; text-align: center; }
  video { width: 100%; border-radius: 18px; background: #2B6E62; box-shadow: 0 6px 24px rgba(29, 43, 46, .2); display: block; }
  p { line-height: 1.5; text-align: center; color: #4F6166; }
</style>
</head>
<body>
<div class="top">
  <div class="langs">
    <button data-l="de">Deutsch</button>
    <button data-l="en">English</button>
    <button data-l="wes" hidden>Pidgin</button>
  </div>
</div>
<main>
  <h1 id="h"></h1>
  <video id="v" controls playsinline preload="metadata"></video>
  <p id="p"></p>
</main>
<script>
  // Eine Seite für alle Sprachen: ?lang=de|en|wes. Pidgin nur, wenn die App es mitschickt (&p=1 = in der App freigeschaltet)
  var T = {
    de: { title: 'Meet us There – Erklärvideo', h: 'So funktioniert Meet us There', p: 'Sag, wo du sowieso bist. Wer mag, kommt vorbei – keine Zusagen, kein Druck.' },
    en: { title: 'Meet us There – Explainer video', h: 'How Meet us There works', p: "Share where you'll be anyway. Whoever likes drops by – no commitments, no pressure." },
    wes: { title: 'Meet us There – Video', h: 'How Meet us There di work', p: 'Tell dem where you go dey anyway. Anybody wey want go pass – no promise, no pressure.' }
  };
  var q = new URLSearchParams(location.search);
  var lang = q.get('lang');
  var pidgin = q.get('p') === '1' || lang === 'wes';
  if (pidgin) document.querySelector('[data-l="wes"]').hidden = false;

  function show(l) {
    var t = T[l], v = document.getElementById('v');
    document.documentElement.lang = l === 'de' ? 'de' : 'en';
    document.title = t.title;
    document.getElementById('h').textContent = t.h;
    document.getElementById('p').textContent = t.p;
    v.pause();
    v.poster = 'poster-' + l + '.jpg';
    v.src = 'erklaervideo-' + l + '.mp4';
    v.load();
    document.querySelectorAll('.langs button').forEach(function (b) { b.classList.toggle('on', b.dataset.l === l); });
    history.replaceState(null, '', '?lang=' + l + (pidgin ? '&p=1' : ''));
  }
  document.querySelectorAll('.langs button').forEach(function (b) { b.onclick = function () { show(b.dataset.l); }; });
  show(T[lang] && (lang !== 'wes' || pidgin) ? lang : /^de/i.test(navigator.language || '') ? 'de' : 'en');
</script>
</body>
</html>
